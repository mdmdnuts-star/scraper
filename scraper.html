<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Scraper Intelligence Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #38bdf8;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #0369a1;
            color: #fff;
            border-color: #38bdf8;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button.action-btn {
            padding: 12px 24px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.action-btn:hover {
            background-color: #0ea5e9;
        }
        .results-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            margin-top: 20px;
            display: none;
        }
        .results-card h3 {
            margin-top: 0;
            color: #38bdf8;
        }
        .tag {
            display: inline-block;
            background-color: #0369a1;
            color: #e0f2fe;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
        }
        .section-title {
            font-size: 0.95rem;
            color: #38bdf8;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .media-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
        }
        .media-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
        }
        .links-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 120px;
            overflow-y: auto;
        }
        .links-list li {
            margin-bottom: 4px;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .links-list a {
            color: #38bdf8;
            text-decoration: none;
        }
        .links-list a:hover {
            text-decoration: underline;
        }
        .loader {
            display: none;
            color: #38bdf8;
            margin-top: 10px;
            font-style: italic;
        }
        .hidden-section {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Data Intelligence Pipeline</h1>
        <p>Dispatch background worker nodes to analyze standard websites or public social media profiles through AI.</p>

        <!-- Mode Selection Tabs -->
        <div class="tabs">
            <button class="tab-btn active" id="webTabBtn" onclick="switchMode('web')">Website Crawler</button>
            <button class="tab-btn" id="igTabBtn" onclick="switchMode('ig')">Instagram Scraper</button>
        </div>

        <!-- Website Input Panel -->
        <div id="webPanel" class="input-group">
            <input type="text" id="urlInput" placeholder="Enter target URL (e.g., https://example.com)" value="https://example.com">
            <button class="action-btn" onclick="triggerScrape('web')">Dispatch Crawler</button>
        </div>

        <!-- Instagram Input Panel -->
        <div id="igPanel" class="input-group hidden-section">
            <input type="text" id="igInput" placeholder="Enter Instagram handle (e.g., nasa)" value="nasa">
            <button class="action-btn" onclick="triggerScrape('ig')">Scrape Profile</button>
        </div>

        <div id="loader" class="loader">Processing intelligence target and extracting visual assets... Please wait...</div>

        <!-- Results Card -->
        <div id="resultsCard" class="results-card">
            <h3 id="resTitle"></h3>
            <p id="resSnippet"></p>
            <div><strong>Source:</strong> <a id="resUrl" href="#" target="_blank" style="color: #38bdf8;"></a></div>
            <div><span class="tag" id="resSentiment"></span></div>

            <!-- Harvested Media Assets Section -->
            <div id="mediaSection">
                <div class="section-title">Harvested Media Assets & Visuals</div>
                <div class="media-grid" id="resMediaGrid"></div>
            </div>

            <!-- Outbound Footprints Section -->
            <div id="linksSection">
                <div class="section-title">Outbound Digital Footprints & Social Links</div>
                <ul class="links-list" id="resLinksList"></ul>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'web';

        function switchMode(mode) {
            currentMode = mode;
            const webTab = document.getElementById('webTabBtn');
            const igTab = document.getElementById('igTabBtn');
            const webPanel = document.getElementById('webPanel');
            const igPanel = document.getElementById('igPanel');

            document.getElementById('resultsCard').style.display = 'none';

            if (mode === 'web') {
                webTab.classList.add('active');
                igTab.classList.remove('active');
                webPanel.style.display = 'flex';
                igPanel.style.display = 'none';
            } else {
                igTab.classList.add('active');
                webTab.classList.remove('active');
                igPanel.style.display = 'flex';
                webPanel.style.display = 'none';
            }
        }

        async function triggerScrape(type) {
            const loader = document.getElementById('loader');
            const resultsCard = document.getElementById('resultsCard');
            
            let endpoint = '';
            let payload = {};

            if (type === 'web') {
                const url = document.getElementById('urlInput').value;
                if (!url) { alert('Please enter a valid URL'); return; }
                endpoint = 'http://localhost:3000/api/scrape';
                payload = { url };
            } else {
                const username = document.getElementById('igInput').value.trim();
                if (!username) { alert('Please enter a valid Instagram handle'); return; }
                endpoint = 'http://localhost:3000/api/scrape-instagram';
                payload = { username };
            }

            loader.style.display = 'block';
            resultsCard.style.display = 'none';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Failed to process intelligence request');
                }

                // Populate core UI data
                document.getElementById('resTitle').innerText = result.data.title;
                document.getElementById('resSnippet').innerText = result.data.snippet;
                const linkElem = document.getElementById('resUrl');
                linkElem.href = result.data.url;
                linkElem.innerText = result.data.url;
                document.getElementById('resSentiment').innerText = `Sentiment: ${result.data.sentiment}`;

                // Render Harvested Media Assets
                const mediaGrid = document.getElementById('resMediaGrid');
                mediaGrid.innerHTML = '';
                const mediaUrls = result.data.media_urls || [];
                if (mediaUrls.length > 0) {
                    document.getElementById('mediaSection').style.display = 'block';
                    mediaUrls.forEach(imgUrl => {
                        const img = document.createElement('img');
                        img.src = imgUrl;
                        img.className = 'media-thumb';
                        img.onerror = () => img.remove(); // Remove broken image links gracefully
                        mediaGrid.appendChild(img);
                    });
                } else {
                    document.getElementById('mediaSection').style.display = 'none';
                }

                // Render Outbound Links & Social Footprints
                const linksList = document.getElementById('resLinksList');
                linksList.innerHTML = '';
                const outboundLinks = result.data.outbound_links || [];
                if (outboundLinks.length > 0) {
                    document.getElementById('linksSection').style.display = 'block';
                    outboundLinks.forEach(link => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = link;
                        a.target = '_blank';
                        a.innerText = link;
                        li.appendChild(a);
                        linksList.appendChild(li);
                    });
                } else {
                    document.getElementById('linksSection').style.display = 'none';
                }

                loader.style.display = 'none';
                resultsCard.style.display = 'block';

            } catch (err) {
                loader.style.display = 'none';
                alert(`Error: ${err.message}`);
            }
        }
    </script>
</body>
</html>
